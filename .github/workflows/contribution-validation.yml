name: Contribution validation
run-name: Validate issue ${{ inputs.issue }} at ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue to validate
        required: true
        type: choice
        options: ['20446', '25437', '43161']
      source_ref:
        description: Fork branch or commit to build
        required: true
        type: string
      capture_ui:
        description: Export isolated Settings UI debug build for visual validation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      ISSUE: ${{ inputs.issue }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.100'
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-net100-${{ hashFiles('Directory.Packages.props') }}
      - name: Enable long paths and record environment
        run: |
          Set-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 1
          git config core.longpaths true
          git submodule update --init --recursive
          @{ sdk = @{ version = '10.0.100'; rollForward = 'disable' } } | ConvertTo-Json | Set-Content global.json
          dotnet --info
      - name: Select projects
        run: |
          switch ($env:ISSUE) {
            '20446' {
              'TEST_PROJECT=src/modules/launcher/Wox.Test' >> $env:GITHUB_ENV
              'TEST_NAME=Wox.Test' >> $env:GITHUB_ENV
              'TEST_FILTER=FullyQualifiedName~Wox.Test' >> $env:GITHUB_ENV
              'BUILD_SETTINGS=true' >> $env:GITHUB_ENV
            }
            '25437' {
              'TEST_PROJECT=src/modules/launcher/Plugins/Microsoft.PowerToys.Run.Plugin.Calculator.UnitTest' >> $env:GITHUB_ENV
              'TEST_NAME=Microsoft.PowerToys.Run.Plugin.Calculator.UnitTest' >> $env:GITHUB_ENV
              'TEST_FILTER=FullyQualifiedName~Microsoft.PowerToys.Run.Plugin.Calculator.UnitTests' >> $env:GITHUB_ENV
            }
            '43161' {
              'TEST_PROJECT=src/settings-ui/Settings.UI.UnitTests' >> $env:GITHUB_ENV
              'TEST_NAME=Settings.UI.UnitTests' >> $env:GITHUB_ENV
              'TEST_FILTER=' >> $env:GITHUB_ENV
            }
            default { throw 'Unsupported issue' }
          }
      - name: Isolate paths for UI evidence build
        if: inputs.capture_ui
        run: |
          $helperPath = 'src/settings-ui/Settings.UI.Library/Utilities/Helper.cs'
          $helper = Get-Content $helperPath -Raw
          $helper = $helper.Replace('            WindowsIdentity currentUser = WindowsIdentity.GetCurrent();', @'
                      var validationRoot = Environment.GetEnvironmentVariable("POWERTOYS_UI_VALIDATION_ROOT");
                      if (!string.IsNullOrEmpty(validationRoot))
                      {
                          return validationRoot;
                      }

                      WindowsIdentity currentUser = WindowsIdentity.GetCurrent();
          '@)
          Set-Content $helperPath $helper -NoNewline
          $loggerPath = 'src/common/ManagedCommon/Logger.cs'
          $logger = Get-Content $loggerPath -Raw
          $logger = $logger.Replace('Constants.AppDataPath() + applicationLogPath', '(Environment.GetEnvironmentVariable("POWERTOYS_UI_VALIDATION_ROOT") is string validationRoot ? Path.Combine(validationRoot, "Microsoft", "PowerToys") : Constants.AppDataPath()) + applicationLogPath')
          Set-Content $loggerPath $logger -NoNewline
          $appPath = 'src/settings-ui/Settings.UI/SettingsXAML/App.xaml.cs'
          $app = Get-Content $appPath -Raw
          $app = $app.Replace('= typeof(Views.DashboardPage);', '= typeof(Views.PowerLauncherPage);')
          Set-Content $appPath $app -NoNewline
          New-Item artifacts -ItemType Directory -Force | Out-Null
          git diff | Set-Content artifacts/ui-evidence-isolation.patch
          git rev-parse HEAD | Set-Content artifacts/ui-evidence-source-commit.txt
      - name: Build test project with production dependencies
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & ./tools/build/build.ps1 -Path $env:TEST_PROJECT -Platform x64 -Configuration Debug -ExtraArgs @('/restore', '/p:RestorePackagesConfig=true', "/p:SolutionDir=$pwd\")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Settings UI for range change
        if: env.BUILD_SETTINGS == 'true'
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & ./tools/build/build.ps1 -Path src/settings-ui/Settings.UI -Platform x64 -Configuration Debug -ExtraArgs @('/restore', '/p:RestorePackagesConfig=true', "/p:SolutionDir=$pwd\")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run tests with Visual Studio test runner
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          $runner = Join-Path $vs 'Common7/IDE/Extensions/TestPlatform/vstest.console.exe'
          $roots = @('x64/Debug', 'Debug/x64', "$env:TEST_PROJECT/bin") | Where-Object { Test-Path $_ }
          $tests = Get-ChildItem $roots -Recurse -Filter "$($env:TEST_NAME).dll" | Where-Object { $_.Directory.Name -notin @('ref', 'refint') } | Select-Object -First 1
          if (-not $tests) { throw "Test assembly $($env:TEST_NAME) not found" }
          if ($env:ISSUE -eq '20446') {
            $fixturePath = Join-Path $tests.Directory.FullName 'TestData/PowerLauncherPage.xaml'
            $fixedFixture = [IO.File]::ReadAllText($fixturePath)
            try {
              [IO.File]::WriteAllText($fixturePath, $fixedFixture.Replace('Maximum="20000"', 'Maximum="1000"').Replace('Minimum="-20000"', 'Minimum="-1000"'))
              & $runner $tests.FullName '/TestCaseFilter:FullyQualifiedName~SortAllowsPluginModifiersToOverrideHighScoringGlobalResults' '/Logger:trx;LogFileName=baseline.trx' '/ResultsDirectory:artifacts/test-results'
              if ($LASTEXITCODE -eq 0) { throw 'Ranking regression tests unexpectedly passed with the original Settings limits' }
              [xml]$baseline = Get-Content artifacts/test-results/baseline.trx -Raw
              $counts = $baseline.TestRun.ResultSummary.Counters
              if ([int]$counts.failed -ne 6 -or [int]$counts.total -ne 6) { throw 'Expected all six baseline ranking scenarios to fail' }
            } finally {
              [IO.File]::WriteAllText($fixturePath, $fixedFixture)
            }
          }
          $testArguments = @($tests.FullName, '/Logger:trx;LogFileName=validation.trx', '/ResultsDirectory:artifacts/test-results')
          if ($env:TEST_FILTER) { $testArguments += "/TestCaseFilter:$env:TEST_FILTER" }
          & $runner @testArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle Settings UI for visual validation
        if: inputs.capture_ui && success()
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory((Join-Path $pwd 'x64/Debug/WinUI3Apps'), (Join-Path $pwd 'artifacts/settings-ui-build.zip'), [IO.Compression.CompressionLevel]::Fastest, $false)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.capture_ui && success()
        with:
          name: settings-ui-evidence-build
          path: |
            artifacts/settings-ui-build.zip
            artifacts/ui-evidence-isolation.patch
            artifacts/ui-evidence-source-commit.txt
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-${{ inputs.issue }}
          path: |
            artifacts/logs
            artifacts/test-results
          retention-days: 7
